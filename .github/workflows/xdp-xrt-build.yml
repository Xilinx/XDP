# XDP Build — build XRT with this PR's XDP tree overlaid for each platform.
#
# Triggers:
#   - pull_request → master (opened / sync / reopened / labeled / unlabeled)
#   - workflow_dispatch (manual)
#
# Platform selection on pull_request:
#   - Add label build-xrt-alveo | build-xrt-edge | build-xrt-ve2 | build-xrt-client
#     to run only that platform's job.
#   - With none of those labels, all four jobs run in parallel.
#   - workflow_dispatch always schedule all four jobs.

name: XDP Build

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: xdp-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Alveo — native XRT build
  # Label: build-xrt-alveo
  # ---------------------------------------------------------------------------
  build-xrt-alveo:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && (
        contains(github.event.pull_request.labels.*.name, 'build-xrt-alveo') ||
        (
          !contains(github.event.pull_request.labels.*.name, 'build-xrt-alveo') &&
          !contains(github.event.pull_request.labels.*.name, 'build-xrt-edge') &&
          !contains(github.event.pull_request.labels.*.name, 'build-xrt-ve2') &&
          !contains(github.event.pull_request.labels.*.name, 'build-xrt-client')
        )
      ))
    runs-on: [self-hosted, Ubuntu-22.04]
    timeout-minutes: 60
    concurrency:
      group: xdp-alveo-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true

    steps:
      - name: Register path masks
        run: |
          echo "::add-mask::${{ secrets.MASK_SCRATCH_PREFIX }}"
          echo "::add-mask::${{ secrets.MASK_HOME_PREFIX }}"

      - name: Checkout XDP
        uses: actions/checkout@v4
        with:
          path: xdp-pr
          fetch-depth: 0

      - name: Clone XRT
        run: |
          rm -rf XRT
          git clone https://github.com/Xilinx/XRT.git XRT
          git -C XRT submodule update --init --recursive

      - name: Overlay XDP
        run: |
          rm -rf XRT/src/runtime_src/xdp
          cp -r "${GITHUB_WORKSPACE}/xdp-pr" XRT/src/runtime_src/xdp

      - name: Build XRT for Alveo
        run: |
          cd XRT/build
          chmod +x build.sh
          ./build.sh -noinit -noert

      - name: Validate build outputs
        run: |
          set -euo pipefail
          XRT_ROOT="XRT/build/Release/opt/xilinx/xrt"

          echo "Built shared libraries under ${XRT_ROOT}:"
          find "${XRT_ROOT}" -name '*.so*' | sort || true

          XRT_CORE="$(find "${XRT_ROOT}" -name 'libxrt_core.so*' -type f | head -1)"
          XDP_CORE="$(find "${XRT_ROOT}" -name 'libxdp_core.so*' -type f | head -1)"

          test -n "${XRT_CORE}" || { echo "libxrt_core not found under ${XRT_ROOT}"; exit 1; }
          test -n "${XDP_CORE}" || { echo "libxdp_core not found under ${XRT_ROOT}"; exit 1; }
          echo "Validated ${XRT_CORE}"
          echo "Validated ${XDP_CORE}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xrt-alveo-build-${{ github.event.pull_request.number || github.run_id }}
          path: |
            XRT/build/Release/opt/xilinx/xrt/**/libxrt*.so*
            XRT/build/Release/opt/xilinx/xrt/**/libxdp*.so*
            XRT/build/Release/opt/xilinx/xrt/**/xrt/module/*.so*
          retention-days: 1

      - name: Build summary
        if: always()
        run: |
          XRT_ROOT="XRT/build/Release/opt/xilinx/xrt"
          echo "## XDP Alveo Build" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- PR: #${{ github.event.pull_request.number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Platform: Alveo (native)" >> "$GITHUB_STEP_SUMMARY"
          if find "${XRT_ROOT}" -name 'libxrt_core.so*' -type f 2>/dev/null | grep -q . && \
             find "${XRT_ROOT}" -name 'libxdp_core.so*' -type f 2>/dev/null | grep -q .; then
            echo "- Result: success" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Result: failed" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------------------
  # Edge — Versal aarch RPM build (xrt + zocl)
  # Label: build-xrt-edge
  # ---------------------------------------------------------------------------
  build-xrt-edge:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && (
        contains(github.event.pull_request.labels.*.name, 'build-xrt-edge') ||
        (
          !contains(github.event.pull_request.labels.*.name, 'build-xrt-alveo') &&
          !contains(github.event.pull_request.labels.*.name, 'build-xrt-edge') &&
          !contains(github.event.pull_request.labels.*.name, 'build-xrt-ve2') &&
          !contains(github.event.pull_request.labels.*.name, 'build-xrt-client')
        )
      ))
    runs-on: [self-hosted, Ubuntu-22.04]
    timeout-minutes: 120
    concurrency:
      group: xdp-edge-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true

    steps:
      - name: Register path masks
        run: |
          echo "::add-mask::${{ secrets.MASK_SCRATCH_PREFIX }}"
          echo "::add-mask::${{ secrets.MASK_HOME_PREFIX }}"

      - name: Checkout XDP
        uses: actions/checkout@v4
        with:
          path: xdp-pr
          fetch-depth: 0

      - name: Clone XRT
        run: |
          rm -rf XRT
          git clone https://github.com/Xilinx/XRT.git XRT
          git -C XRT submodule update --init --recursive

      - name: Overlay XDP
        run: |
          rm -rf XRT/src/runtime_src/xdp
          cp -r "${GITHUB_WORKSPACE}/xdp-pr" XRT/src/runtime_src/xdp

      - name: Build XRT for Edge
        run: |
          cd XRT/build
          chmod +x build_edge.sh
          ./build_edge.sh -aarch versal -noinit

      - name: Validate build outputs
        run: |
          ls XRT/build/versal/rpms/xrt*.rpm
          ls XRT/build/versal/rpms/zocl*.rpm

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xrt-edge-build-${{ github.event.pull_request.number || github.run_id }}
          path: |
            XRT/build/versal/rpms/*.rpm
            XRT/build/versal/install_xrt.sh
            XRT/build/versal/reinstall_xrt.sh
            XRT/build/versal/rpm.txt
          retention-days: 1

      - name: Build summary
        if: always()
        run: |
          echo "## XDP Edge Build" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- PR: #${{ github.event.pull_request.number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Platform: Edge (versal aarch)" >> "$GITHUB_STEP_SUMMARY"
          if ls XRT/build/versal/rpms/xrt*.rpm 2>/dev/null | grep -q . && \
             ls XRT/build/versal/rpms/zocl*.rpm 2>/dev/null | grep -q .; then
            echo "- Result: success" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Result: failed" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------------------
  # VE2 — Yocto / xdna-driver bitbake
  # Label: build-xrt-ve2
  # ---------------------------------------------------------------------------
  build-xrt-ve2:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && (
        contains(github.event.pull_request.labels.*.name, 'build-xrt-ve2') ||
        (
          !contains(github.event.pull_request.labels.*.name, 'build-xrt-alveo') &&
          !contains(github.event.pull_request.labels.*.name, 'build-xrt-edge') &&
          !contains(github.event.pull_request.labels.*.name, 'build-xrt-ve2') &&
          !contains(github.event.pull_request.labels.*.name, 'build-xrt-client')
        )
      ))
    runs-on: [self-hosted, Ubuntu-22.04]
    timeout-minutes: 480
    concurrency:
      group: xdp-ve2-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    env:
      XDNA_DIR: ${{ github.workspace }}/ve2-build/xdna-driver
      XDNA_BRANCH: ve2_accel
      VE2_RPM_DIR: ${{ github.workspace }}/ve2-build/yocto/edf/rpms

    steps:
      - name: Register path masks
        run: |
          echo "::add-mask::${{ secrets.MASK_SCRATCH_PREFIX }}"
          echo "::add-mask::${{ secrets.MASK_HOME_PREFIX }}"

      - name: Checkout XDP
        uses: actions/checkout@v4
        with:
          path: xdp-pr
          fetch-depth: 0
          submodules: recursive

      - name: Prepare xdna-driver and overlay this PR
        run: |
          set -euo pipefail
          if [ -d "${XDNA_DIR}/.git" ]; then
            rm -rf "${XDNA_DIR}"
          fi
          git clone --recurse-submodules -b "${XDNA_BRANCH}" \
            https://github.com/amd/xdna-driver "${XDNA_DIR}"

          # First-time Yocto setup would otherwise reset xrt and drop the overlay.
          sed -i 's/^[[:space:]]*git submodule update --init --recursive --force/# git submodule update --init --recursive --force/' \
            "${XDNA_DIR}/build/build_ve2.sh"

          rm -rf "${XDNA_DIR}/xrt/src/runtime_src/xdp"
          cp -a "${GITHUB_WORKSPACE}/xdp-pr" "${XDNA_DIR}/xrt/src/runtime_src/xdp"

      - name: Build VE2 RPMs
        run: |
          set -euo pipefail
          mkdir -p "${GITHUB_WORKSPACE}/bin"
          if ! command -v repo >/dev/null || [[ "$(repo --version 2>&1 | grep -oP 'repo launcher version \K[0-9.]+' || true)" < "2.5" ]]; then
            curl -fsSL -o "${GITHUB_WORKSPACE}/bin/repo" \
              https://storage.googleapis.com/git-repo-downloads/repo
            chmod a+x "${GITHUB_WORKSPACE}/bin/repo"
          fi
          export PATH="${GITHUB_WORKSPACE}/bin:$PATH"

          cd "${XDNA_DIR}/build"
          bash build_ve2.sh | tee /tmp/build_ve2.log
          if grep -q "bitbake xrt failed" /tmp/build_ve2.log; then
            echo "bitbake xrt failed"
            exit 1
          fi

      - name: Validate build outputs
        run: |
          set -euo pipefail
          find "${VE2_RPM_DIR}" -name 'xrt*.rpm' | tee /tmp/ve2-rpms.txt
          test -s /tmp/ve2-rpms.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xrt-ve2-build-${{ github.event.pull_request.number || github.run_id }}
          path: ${{ env.VE2_RPM_DIR }}/xrt*.rpm
          retention-days: 1

      - name: Build summary
        if: always()
        run: |
          echo "## XDP VE2 Build" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- PR: #${{ github.event.pull_request.number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Platform: VE2 (xdna-driver ${XDNA_BRANCH})" >> "$GITHUB_STEP_SUMMARY"
          echo "- RPM directory: ${VE2_RPM_DIR}" >> "$GITHUB_STEP_SUMMARY"
          if find "${VE2_RPM_DIR}" -name 'xrt*.rpm' 2>/dev/null | grep -q .; then
            echo "- Result: success" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Result: failed" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ---------------------------------------------------------------------------
  # Client — placeholder (not implemented yet)
  # Label: build-xrt-client
  # ---------------------------------------------------------------------------
  build-xrt-client:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && (
        contains(github.event.pull_request.labels.*.name, 'build-xrt-client') ||
        (
          !contains(github.event.pull_request.labels.*.name, 'build-xrt-alveo') &&
          !contains(github.event.pull_request.labels.*.name, 'build-xrt-edge') &&
          !contains(github.event.pull_request.labels.*.name, 'build-xrt-ve2') &&
          !contains(github.event.pull_request.labels.*.name, 'build-xrt-client')
        )
      ))
    runs-on: [self-hosted, Ubuntu-22.04]
    steps:
      - name: Register path masks
        run: |
          echo "::add-mask::${{ secrets.MASK_SCRATCH_PREFIX }}"
          echo "::add-mask::${{ secrets.MASK_HOME_PREFIX }}"

      - run: echo "Client build not implemented yet"

      - name: Build summary
        if: always()
        run: |
          echo "## XDP Client Build" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- PR: #${{ github.event.pull_request.number }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Platform: Client" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: skipped (not implemented)" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # Gate — on PRs only: fail the workflow if any *scheduled* build failed.
  # Skipped jobs (wrong label set) count as OK so selective label runs work.
  # ---------------------------------------------------------------------------
  ci-required:
    if: always() && github.event_name == 'pull_request'
    needs: [build-xrt-alveo, build-xrt-edge, build-xrt-ve2, build-xrt-client]
    runs-on: ubuntu-latest
    steps:
      - name: Require all scheduled builds to pass
        run: |
          check_result() {
            local job="$1"
            local result="$2"
            if [ "${result}" = "skipped" ]; then
              echo "${job}: skipped"
              return 0
            fi
            if [ "${result}" = "success" ]; then
              echo "${job}: success"
              return 0
            fi
            echo "${job}: ${result}"
            return 1
          }

          failed=0
          check_result build-xrt-alveo "${{ needs.build-xrt-alveo.result }}" || failed=1
          check_result build-xrt-edge "${{ needs.build-xrt-edge.result }}" || failed=1
          check_result build-xrt-ve2 "${{ needs.build-xrt-ve2.result }}" || failed=1
          check_result build-xrt-client "${{ needs.build-xrt-client.result }}" || failed=1

          if [ "${failed}" -ne 0 ]; then
            echo "One or more XDP builds failed"
            exit 1
          fi

          echo "All scheduled XDP builds passed"
